<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地図テスト</title>
<style>
body { margin: 0; font-family: sans-serif; }
#map { width: 100%; height: 100vh; background: #eee; }
#msg {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%);
  background: #333; color: #fff;
  padding: 10px 20px; border-radius: 24px;
  font-size: 15px; z-index: 10;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
</style>
</head>
<body>
<div id="msg">⏳ 読み込み中...</div>
<div id="map"></div>

<script>
function msg(text, color) {
  var el = document.getElementById("msg");
  el.textContent = text;
  el.style.background = color || "#333";
}

// 認証エラー
window.gm_authFailure = function() {
  msg("❌ APIキー認証エラー", "#c00");
};

// 12秒後もmapがなければタイムアウト表示
setTimeout(function() {
  if (!window._ok) {
    msg("❌ タイムアウト：Maps APIが応答しません", "#c00");
  }
}, 12000);

// 地図初期化（シンプルな従来方式）
function initMap() {
  try {
    new google.maps.Map(document.getElementById("map"), {
      center: { lat: 35.69, lng: 139.70 },
      zoom: 11
    });
    window._ok = true;
    msg("✅ 地図の読み込み成功！", "#1a7");
  } catch(e) {
    msg("❌ " + e.message, "#c00");
  }
}
</script>

<!-- loading=async を追加した従来方式 -->
<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDd3mAUK7387OySl-t9LQMmMQ6P-vljR-0&loading=async&callback=initMap&language=ja"
  async defer>
</script>
</body>
</html>
